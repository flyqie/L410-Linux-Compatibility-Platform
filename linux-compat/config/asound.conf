# Linux ALSA playback -> private FIFO -> HarmonyOS AudioRenderer.
# No host ALSA or audio device nodes are exposed.
pcm.l410_sink {
    type file
    slave.pcm "null"
    file "/run/l410-audio/playback"
    format "raw"
}
pcm.l410_playback {
    type plug
    slave {
        pcm "l410_sink"
        format S16_LE
        rate 48000
        channels 2
    }
}

pcm.l410_capture_raw {
    type file
    slave.pcm "null"
    file "/dev/null"
    infile "/run/l410-audio/capture"
    format "raw"
}
pcm.l410_capture {
    type plug
    slave { pcm "l410_capture_raw" format S16_LE rate 48000 channels 1 }
}
pcm.!default {
    type pulse
    server "unix:/run/l410-pulse/native"
}
ctl.!default { type pulse server "unix:/run/l410-pulse/native" }
